<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <title>Farm Intellect — AI-Powered Farming for India</title>
    <meta
      name="description"
      content="India's smart agriculture platform: AI crop recommendations, weather forecasts, pest detection, market prices & government schemes for farmers."
    />
    <meta name="author" content="Farm Intellect" />
    <meta
      name="keywords"
      content="smart farming, crop advisory, Indian agriculture, AI farming, kisan, PM-KISAN, mandi prices"
    />
    <meta name="robots" content="%ROBOTS_POLICY%" />

    <!-- App Manifest and Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" />

    <!-- Core Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap"
    />

    <!-- Hero Image Preload -->
    <link
      rel="preload"
      as="image"
      href="/hero-farming.jpg"
      fetchpriority="high"
    />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=swap"

      rel="stylesheet"

      rel="stylesheet"

    />

    <!-- Open Graph Metadata -->
    <meta
      property="og:title"
      content="Farm Intellect — AI-Powered Smart Agriculture for India 🌾"
    />
    <meta
      property="og:description"
      content="22-language AI crop advisory, weather, pest detection, market prices & government schemes for Indian farmers."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://farm-intellect-web.vercel.app"
    />
    <meta
      property="og:image"
      content="https://farm-intellect-web.vercel.app/social-preview.png"
    />

    <meta name="theme-color" content="#1a7d3a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Farm Intellect" />

    <!-- DNS Prefetch -->
    <link rel="dns-prefetch" href="//analytics.google.com" />
    <link rel="dns-prefetch" href="//www.googletagmanager.com" />

    />

    <meta
      name="twitter:title"

      name="twitter:description"

      content="https://farm-intellect-web.vercel.app/social-preview.png"
